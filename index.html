
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Calculator</title>
  <style>
    :root{--bg:#0f1724;--card:#111827;--accent:#06b6d4;--muted:#94a3b8;--glass:rgba(255,255,255,0.03)}
    *{box-sizing:border-box;font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#071126 0%,#012233 100%);color:#e6eef6}
    .calculator{width:360px;background:var(--card);border-radius:16px;padding:18px;box-shadow:0 10px 30px rgba(2,6,23,0.6)}
    .error{min-height:18px;color:#ffbaba;background:rgba(255, 0, 0, 0.04);padding:6px 10px;border-radius:8px;font-size:13px;margin-bottom:8px;display:none}
    .display{background:var(--glass);padding:16px;border-radius:12px;margin-bottom:12px}
    .top-row{display:flex;justify-content:space-between;align-items:center}
    .small{font-size:13px;color:var(--muted)}
    #result{font-size:28px;font-weight:600;text-align:right;word-break:break-all}
    .buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    button{padding:16px;border-radius:10px;border:0;background:#0b1220;color:var(--muted);font-weight:600;font-size:18px;cursor:pointer;transition:transform .08s ease}
    button:active{transform:translateY(2px)}
    .op{background:#061729;color:var(--accent)}
    .wide{grid-column:span 2}
    .backspace{background:#1f2937;color:#fff}
    .clear{background:#6b7280;color:#fff}
  </style>
</head>
<body>
  <div class="calculator" role="application" aria-label="Calculator">
    <div id="error" class="error" aria-live="polite"></div>

    <div class="display">
      <div class="top-row">
        <div class="small">Calculator</div>
        <div class="small">Keyboard: numbers, + - * / . Enter =, Backspace/delete</div>
      </div>
      <div id="result">0</div>
    </div>

    <div class="buttons">
      <button id="btn-clear" class="clear">C</button>
      <button id="btn-back" class="backspace">⌫</button>
      <button id="btn-pct" class="op">%</button>
      <button data-op="/" class="op">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button data-op="*" class="op">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-op="-" class="op">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-op="+" class="op">+</button>

      <button data-num="0" class="wide">0</button>
      <button data-num="." class="op">.</button>
      <button id="btn-equals" class="op">=</button>
    </div>
  </div>

  <script>
  
    const resultEl = document.getElementById('result');
    const errorEl = document.getElementById('error');
    const buttons = document.querySelectorAll('button');

    let current = ''; 
    let previous = null; 
    let operator = null;

    function showError(msg){
      if(!msg){ errorEl.style.display='none'; errorEl.textContent=''; return }
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }

    function updateDisplay(){
      resultEl.textContent = current || (previous!==null ? formatNumber(previous) : '0');
    }

    function formatNumber(n){
      if(n === null || n === undefined) return '';
      if(Number.isInteger(n)) return String(n);
    
      return parseFloat(n.toFixed(8)).toString();
    }

    function clearAll(){ current=''; previous=null; operator=null; showError(''); updateDisplay(); }

    function deleteLast(){
      if(current.length>0) current = current.slice(0,-1);
      else showError('Nothing to delete');
      updateDisplay();
    }

    function appendNumber(ch){
      showError('');
      if(ch === '.' && current.includes('.')) return;
      current += ch;
      updateDisplay();
    }

    function chooseOperator(op){
      showError('');
      if(current === '' && previous === null) { showError('Enter a number first'); return }
      if(current === '' && previous !== null){ operator = op; return }
      const currNum = Number(current);
      if(previous === null){ previous = currNum; }
      else { previous = compute(previous, operator, currNum); }
      operator = op;
      current = '';
      updateDisplay();
    }

    function compute(a, op, b){
      if(op === '+') return a + b;
      if(op === '-') return a - b;
      if(op === '*') return a * b;
      if(op === '/'){
        if(b === 0){ showError('Cannot divide by zero'); return a; }
        return a / b;
      }
      if(op === '%') return a % b;
      return b;
    }

    function pressEquals(){
      showError('');
      if(operator === null && current === ''){ showError('No operation to perform'); return }
      if(current === ''){ showError('Enter second number'); return }
      const currNum = Number(current);
      if(operator === '/' && currNum === 0){ showError('Cannot divide by zero'); return }
      previous = compute(previous === null ? 0 : previous, operator, currNum);
      current = '';
      operator = null;
      updateDisplay();
    }

   
    buttons.forEach(b => {
      b.addEventListener('click', e => {
        const num = b.dataset.num;
        const op = b.dataset.op;
        if(b.id === 'btn-clear') clearAll();
        else if(b.id === 'btn-back') deleteLast();
        else if(b.id === 'btn-equals') pressEquals();
        else if(num !== undefined) appendNumber(num);
        else if(b.id === 'btn-pct') { chooseOperator('%'); }
        else if(op !== undefined) {
          chooseOperator(op);
        }
      })
    })

   
    window.addEventListener('keydown', e => {
      if(e.key >= '0' && e.key <= '9') { appendNumber(e.key); e.preventDefault(); }
      else if(e.key === '.') { appendNumber('.'); e.preventDefault(); }
      else if(e.key === 'Enter' || e.key === '=') { pressEquals(); e.preventDefault(); }
      else if(e.key === 'Backspace' || e.key === 'Delete') { deleteLast(); e.preventDefault(); }
      else if(['+','-','*','/'].includes(e.key)){ chooseOperator(e.key); e.preventDefault(); }
    })

  
    clearAll();
  </script>
</body>
</html>
